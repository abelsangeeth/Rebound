services:
  postgres:
    image: postgres:16-alpine
    container_name: rebound-pg
    environment:
      POSTGRES_USER: rebound
      POSTGRES_PASSWORD: rebound
      POSTGRES_DB: rebound
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebound -d rebound"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rebound-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
